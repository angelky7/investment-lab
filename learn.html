<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>投资课程 · 投资实验室</title>
  <meta name="description" content="36 节投资课：从股票、基金、指数讲到夏普、Beta、压力测试与行为偏差，每级配一个必须动脑的测验。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2300695c'/%3E%3Cpath d='M8 22l5-6 4 3.5L24 10' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="vendor/mdui/mdui.css" />
  <link rel="stylesheet" href="css/app.css" />
  <script defer src="vendor/mdui/mdui.global.js"></script>
</head>
<body>
  <mdui-layout>
    <mdui-top-app-bar>
      <mdui-button-icon id="nav-open" aria-label="打开导航菜单">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3.5 6h17M3.5 12h17M3.5 18h17"/></svg>
      </mdui-button-icon>
      <mdui-top-app-bar-title>投资课程</mdui-top-app-bar-title>
      <div style="flex:1"></div>
      <mdui-button-icon id="theme-toggle" class="btn-theme" aria-label="切换深色/浅色主题"><svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/></svg><svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7.6A4.4 4.4 0 1 0 12 16.4a4.4 4.4 0 0 0 0-8.8zM12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></svg></mdui-button-icon>
    </mdui-top-app-bar>

    <mdui-layout-main>
      <main class="page">
        <header class="page-head">
          <span class="eyebrow">Learn by doing</span>
          <h1>闯关式学习</h1>
          <p class="lead">
            一次只过一关：读一段、答一题、解锁下一关。<b>46 关</b>走完，
            你对收益、风险、成本的直觉会比读十篇文章更牢。
          </p>
        </header>

        <section class="section" id="quest-section">
          <div id="quest-host"></div>
        </section>

        <section class="section">
          <div class="notice" data-tone="info">
            <span>
              不想按顺序？<a href="#practice" id="link-practice">直接刷题</a>，
              或去 <a href="#case" id="link-case">决策训练</a> 做三步处境题。
              闯关进度存在本地，随时可以接着来。
            </span>
          </div>
        </section>

        <section class="section" id="practice-section" hidden>
          <div class="card">
            <div class="chart-head">
              <h3>刷题（独立题库 67 道）</h3>
              <button class="quest-btn" id="back-to-quest">← 回到闯关</button>
            </div>
            <div id="lab-practice"></div>
          </div>
        </section>

        <section class="section" id="case-section" hidden>
          <div class="card">
            <div class="chart-head">
              <h3>决策训练（3 个多步场景）</h3>
              <button class="quest-btn" id="back-to-quest-2">← 回到闯关</button>
            </div>
            <div id="lab-decision"></div>
          </div>
        </section>
      </main>
    </mdui-layout-main>
  </mdui-layout>

  <div id="site-nav"></div>
  <script type="module" src="js/pages/learn.js"></script>
</body>
</html>
