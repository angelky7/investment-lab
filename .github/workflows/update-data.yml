name: Update Data

on:
  schedule:
    # UTC 0:00 = 北京时间 08:00，每天跑一次增量
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "抓取模式：incremental 只补最近数据，full 重建全部历史"
        type: choice
        options: [incremental, full]
        default: incremental

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data
        id: fetch
        continue-on-error: true
        env:
          MODE: ${{ inputs.mode || 'incremental' }}
        run: python scripts/fetch.py --mode "$MODE"

      - name: Build indexes
        run: python scripts/build.py

      - name: Validate data
        id: validate
        continue-on-error: true
        run: python scripts/validate.py

      - name: Write job summary
        if: always()
        run: python scripts/summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "没有数据变化，跳过提交"
          else
            git commit -m "data: 自动更新行情与校验报告（$(TZ='Asia/Shanghai' date +'%Y-%m-%d')）"
            git push
          fi

      - name: Fail if validation found errors
        if: steps.validate.outcome == 'failure'
        run: |
          echo "::error::数据校验发现完整性问题，详情见 data/quality.json"
          exit 1