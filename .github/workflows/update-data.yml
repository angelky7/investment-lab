name: Update Data

on:
  schedule:
    # UTC 0:00 = 北京时间 08:00，每个交易日跑一次增量
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "抓取模式：incremental 只补最近数据，full 重建全部历史"
        type: choice
        options: [incremental, full]
        default: incremental

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data
        id: fetch
        continue-on-error: true
        env:
          MODE: ${{ inputs.mode || 'incremental' }}
        run: python scripts/fetch.py --mode "$MODE"

      - name: Build indexes
        run: python scripts/build.py

      - name: Validate data
        id: validate
        continue-on-error: true
        run: python scripts/validate.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "没有数据变化，跳过提交"
          else
            git commit -m "data: 自动更新行情与校验报告（$(TZ='Asia/Shanghai' date +'%Y-%m-%d')）"
            git push
          fi

      - name: Summary
        run: |
          {
            echo "### 数据更新结果"
            echo ""
            echo "- 抓取步骤: \`${{ steps.fetch.outcome }}\`"
            echo "- 校验步骤: \`${{ steps.validate.outcome }}\`"
            python - <<'PY'
import json, pathlib
meta = json.loads(pathlib.Path("data/meta.json").read_text(encoding="utf-8"))
q = json.loads(pathlib.Path("data/quality.json").read_text(encoding="utf-8"))
print(f"- 数据截止: {meta['data_date']}")
print(f"- 资产: {meta['total_assets']} 项（可用 {meta['available_assets']}）")
print(f"- 记录: {q['summary']['total_points']}")
print(f"- 错误 {q['summary']['error_count']} / 警告 {q['summary']['warning_count']}")
PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if validation found errors
        if: steps.validate.outcome == 'failure'
        run: |
          echo "::error::数据校验发现完整性问题，请查看 data/quality.json"
          exit 1