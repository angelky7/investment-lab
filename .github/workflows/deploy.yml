name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Update Data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # 数据更新任务即使失败（例如某天接口挂了）也要照常部署旧数据，保证站点可用
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./"

      # deploy-pages 偶尔会在 artifact 元数据尚未就绪时立刻失败（Found 0 artifact(s)）。
      # 失败即重试一次，避免把「上传成功但索引未同步」误判成部署失败。
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          enablement: true

      - name: Wait for artifact index
        if: steps.deployment.outcome == 'failure'
        run: sleep 15

      - name: Retry deploy to GitHub Pages
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          enablement: true